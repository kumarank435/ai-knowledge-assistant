spring.application.name=ai-knowledge-assistant
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/ai_knowledge_assistant
spring.datasource.username=root
spring.datasource.password=1435

spring.jpa.hibernate.ddl-auto=update

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=nomic-embed-text

spring.ai.vectorstore.chroma.client.host=http://localhost
spring.ai.vectorstore.chroma.client.port=8000
spring.ai.vectorstore.chroma.initialize-schema=true
spring.ai.vectorstore.chroma.collection-name=ai_knowledge

spring.ai.ollama.chat.options.model=llama3.2:3b

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000